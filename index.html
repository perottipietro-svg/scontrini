<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scontrini">
  <title>Scontrini</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1a73e8;
      --blue-dark: #1558b0;
      --green: #34a853;
      --red: #ea4335;
      --bg: #f1f3f4;
      --surface: #ffffff;
      --surface2: #f8f9fa;
      --border: #dadce0;
      --text: #202124;
      --text-light: #5f6368;
      --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
      --overlay: rgba(0,0,0,0.5);
    }
    [data-theme="dark"] {
      --bg: #111111;
      --surface: #1e1e1e;
      --surface2: #2a2a2a;
      --border: #3c4043;
      --text: #e8eaed;
      --text-light: #9aa0a6;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
      --overlay: rgba(0,0,0,0.7);
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* HEADER */
    .header {
      background: var(--blue);
      color: white;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 20px; font-weight: 500; }
    .header-sub { font-size: 12px; opacity: 0.85; margin-top: 1px; }
    .theme-toggle {
      background: rgba(255,255,255,0.2);
      border: none; color: white; border-radius: 50%;
      width: 38px; height: 38px; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .theme-toggle:active { background: rgba(255,255,255,0.35); }

    /* TOTALE */
    .totale-card {
      background: var(--surface);
      margin: 12px 12px 0; border-radius: 12px;
      padding: 16px 20px; box-shadow: var(--shadow);
      display: flex; justify-content: space-between; align-items: center;
    }
    .totale-label { font-size: 14px; color: var(--text-light); }
    .totale-value { font-size: 28px; font-weight: 600; color: var(--green); }
    .totale-count { font-size: 13px; color: var(--text-light); text-align: right; margin-top: 2px; }

    /* AZIONI */
    .azioni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 12px 0; }
    .btn {
      flex: 1; padding: 10px 6px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 4px; transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-export { background: #e8f0fe; color: var(--blue); }
    .btn-print  { background: #e6f4ea; color: var(--green); }
    .btn-share  { background: #f3e8fd; color: #7b1fa2; }
    .btn-delete-all { background: #fce8e6; color: var(--red); }
    .btn-backup  { background: #fff8e1; color: #f57f17; }
    .btn-restore { background: #e8f5e9; color: #2e7d32; }
    [data-theme="dark"] .btn-export { background: #1a3a6e; color: #8ab4f8; }
    [data-theme="dark"] .btn-print  { background: #0d3b1e; color: #81c995; }
    [data-theme="dark"] .btn-share  { background: #3b1a5e; color: #ce93d8; }
    [data-theme="dark"] .btn-delete-all { background: #4e1a1a; color: #f28b82; }
    [data-theme="dark"] .btn-backup  { background: #3d2e00; color: #ffcc02; }
    [data-theme="dark"] .btn-restore { background: #0d3b1e; color: #81c995; }

    /* LISTA */
    .lista { padding: 12px; padding-bottom: 90px; }
    .lista-vuota { text-align: center; padding: 60px 20px; color: var(--text-light); }
    .lista-vuota .icon { font-size: 64px; margin-bottom: 12px; }
    .lista-vuota p { font-size: 16px; }

    .receipt-card {
      background: var(--surface); border-radius: 12px;
      margin-bottom: 10px; box-shadow: var(--shadow);
      overflow: hidden; display: flex; align-items: stretch;
    }
    .receipt-photo {
      width: 80px; min-height: 80px; flex-shrink: 0;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center; font-size: 32px;
    }
    .receipt-photo img { width: 80px; height: 80px; object-fit: cover; }
    .receipt-info { flex: 1; padding: 12px 14px; min-width: 0; cursor: pointer; }
    .receipt-desc {
      font-size: 15px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .receipt-date { font-size: 12px; color: var(--text-light); margin-top: 3px; }
    .receipt-category {
      display: inline-block; font-size: 11px;
      background: #e8f0fe; color: var(--blue);
      border-radius: 4px; padding: 1px 6px; margin-top: 5px;
    }
    [data-theme="dark"] .receipt-category { background: #1a3a6e; color: #8ab4f8; }
    .receipt-amount {
      font-size: 18px; font-weight: 600; color: var(--green);
      padding: 0 14px; display: flex; align-items: center; flex-shrink: 0; cursor: pointer;
    }
    .receipt-actions {
      display: flex; flex-direction: column; border-left: 1px solid var(--border);
    }
    .receipt-action-btn {
      flex: 1; background: none; border: none; cursor: pointer;
      padding: 0 12px; font-size: 18px; color: var(--text-light);
      display: flex; align-items: center; justify-content: center;
    }
    .receipt-action-btn:active { background: var(--surface2); }

    /* FAB */
    .fab {
      position: fixed; bottom: 24px; right: 20px;
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--blue); color: white; border: none;
      font-size: 28px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(26,115,232,0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; transition: transform 0.15s;
    }
    .fab:active { transform: scale(0.92); }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: var(--overlay); z-index: 300; align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); width: 100%;
      border-radius: 20px 20px 0 0; padding: 20px;
      max-height: 92vh; overflow-y: auto;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 16px;
    }
    .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }

    /* FORM */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 13px; color: var(--text-light);
      margin-bottom: 6px; font-weight: 500;
    }
    .form-group input,
    .form-group select {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 16px; color: var(--text);
      background: var(--surface); outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--blue); }

    /* FOTO AREA */
    .photo-area {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: border-color 0.15s, background 0.15s; position: relative;
    }
    .photo-area:active { background: var(--surface2); }
    .photo-area.has-photo { border-style: solid; border-color: var(--blue); padding: 0; overflow: hidden; }
    .photo-area input { display: none; }
    .photo-area img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
    .photo-area-label { font-size: 14px; color: var(--text-light); margin-top: 8px; }
    .photo-icon { font-size: 40px; }
    .photo-change-overlay {
      display: none; position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.45); color: white;
      font-size: 13px; text-align: center; padding: 8px;
    }
    .photo-area.has-photo .photo-change-overlay { display: block; }

    /* SALVA */
    .btn-salva {
      width: 100%; padding: 14px; background: var(--blue);
      color: white; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn-salva:active { background: var(--blue-dark); }

    /* DETAIL */
    .detail-photo {
      width: 100%; max-height: 280px; object-fit: contain;
      background: #000; border-radius: 10px; margin-bottom: 16px; display: none;
    }
    .detail-row {
      display: flex; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 15px;
    }
    .detail-row:last-of-type { border-bottom: none; }
    .detail-row span:first-child { color: var(--text-light); }
    .detail-row span:last-child { font-weight: 500; }
    .detail-amount { font-size: 32px; font-weight: 700; color: var(--green); text-align: center; padding: 16px 0; }

    /* PRINT */
    @media print {
      .header, .fab, .azioni, .receipt-actions, .modal-overlay { display: none !important; }
      body { background: white; }
      .totale-card { box-shadow: none; border: 1px solid #ddd; }
      .receipt-card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; margin-bottom: 8px; }
      .lista { padding: 0; }
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%); background: #323232; color: white;
      padding: 10px 20px; border-radius: 24px; font-size: 14px;
      z-index: 999; opacity: 0; transition: opacity 0.3s; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>🧾 Scontrini</h1>
    <div class="header-sub">Gestione spese personale</div>
  </div>
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Cambia tema">🌙</button>
</div>

<!-- TOTALE -->
<div class="totale-card">
  <div>
    <div class="totale-label">Totale spese</div>
    <div class="totale-count" id="countLabel">0 scontrini</div>
  </div>
  <div class="totale-value" id="totaleValue">€ 0,00</div>
</div>

<!-- AZIONI -->
<div class="azioni">
  <button class="btn btn-export" onclick="exportCSV()">📊 Esporta</button>
  <button class="btn btn-print" onclick="exportPDF()">📄 PDF</button>
  <button class="btn btn-share" onclick="shareApp()">🔗 Condividi</button>
  <button class="btn btn-delete-all" onclick="confirmDeleteAll()">🗑️ Svuota</button>
  <button class="btn btn-backup" onclick="exportBackup()">💾 Backup</button>
  <button class="btn btn-restore" onclick="document.getElementById('restoreInput').click()">📂 Ripristina</button>
  <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="importBackup(event)">
</div>

<!-- LISTA -->
<div class="lista" id="lista"></div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()">+</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ===== MODAL AGGIUNGI ===== -->
<div class="modal-overlay" id="modalAdd" onclick="closeOnOverlay(event,'modalAdd')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Nuovo scontrino</h2>

    <div class="form-group">
      <label>Foto scontrino</label>
      <div class="photo-area" id="photoArea" onclick="document.getElementById('photoInput').click()">
        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="onPhotoSelected(event)">
        <div class="photo-icon">📷</div>
        <div class="photo-area-label">Tocca per scattare una foto</div>
        <div class="photo-change-overlay">Tocca per cambiare foto</div>
      </div>
    </div>

    <div class="form-group">
      <label>Descrizione *</label>
      <input type="text" id="inputDesc" placeholder="es. Supermercato, Farmacia…" autocomplete="off">
    </div>

    <div class="form-group">
      <label>Importo (€) *</label>
      <input type="number" id="inputAmount" placeholder="0,00" step="0.01" min="0" inputmode="decimal">
    </div>

    <div class="form-group">
      <label>Categoria</label>
      <select id="inputCategory">
        <option value="Altro">Altro</option>
        <option value="Alimentari">Alimentari</option>
        <option value="Farmacia">Farmacia</option>
        <option value="Carburante">Carburante</option>
        <option value="Ristorazione">Ristorazione</option>
        <option value="Abbigliamento">Abbigliamento</option>
        <option value="Casa">Casa</option>
        <option value="Trasporti">Trasporti</option>
        <option value="Salute">Salute</option>
      </select>
    </div>

    <div class="form-group">
      <label>Data</label>
      <input type="date" id="inputDate">
    </div>

    <button class="btn-salva" onclick="saveReceipt()">Salva scontrino</button>
  </div>
</div>

<!-- ===== MODAL DETTAGLIO ===== -->
<div class="modal-overlay" id="modalDetail" onclick="closeOnOverlay(event,'modalDetail')">
  <div class="modal">
    <div class="modal-handle"></div>
    <img id="detailPhoto" class="detail-photo" alt="Foto scontrino">
    <div class="detail-amount" id="detailAmount"></div>
    <div id="detailRows"></div>
    <button class="btn-salva" style="background:#ea4335;margin-top:16px" onclick="deleteCurrentReceipt()">🗑️ Elimina</button>
  </div>
</div>

<script>
// ===== DB =====
let db;
let currentDetailId = null;
const DB_NAME = 'scontriniDB';
const STORE = 'receipts';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}
function dbGetAll() {
  return new Promise((res, rej) => {
    const req = db.transaction(STORE,'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbPut(item) {
  return new Promise((res, rej) => {
    const req = db.transaction(STORE,'readwrite').objectStore(STORE).put(item);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}
function dbDelete(id) {
  return new Promise((res, rej) => {
    const req = db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}
function dbClear() {
  return new Promise((res, rej) => {
    const req = db.transaction(STORE,'readwrite').objectStore(STORE).clear();
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

// ===== RENDER =====
async function renderAll() {
  const receipts = await dbGetAll();
  receipts.sort((a, b) => b.id - a.id);
  const lista = document.getElementById('lista');
  const total = receipts.reduce((s, r) => s + r.amount, 0);
  document.getElementById('totaleValue').textContent = '€ ' + fmt(total);
  document.getElementById('countLabel').textContent = receipts.length + (receipts.length === 1 ? ' scontrino' : ' scontrini');

  if (receipts.length === 0) {
    lista.innerHTML = `<div class="lista-vuota"><div class="icon">🧾</div><p>Nessuno scontrino ancora.<br>Tocca <strong>+</strong> per aggiungerne uno.</p></div>`;
    return;
  }
  lista.innerHTML = '';
  for (const r of receipts) {
    const card = document.createElement('div');
    card.className = 'receipt-card';
    const photoHTML = r.photoBlob
      ? `<div class="receipt-photo"><img src="${URL.createObjectURL(r.photoBlob)}" loading="lazy"></div>`
      : `<div class="receipt-photo">🧾</div>`;
    const dateStr = r.date ? new Date(r.date+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    card.innerHTML = `
      ${photoHTML}
      <div class="receipt-info" onclick="openDetail(${r.id})">
        <div class="receipt-desc">${esc(r.description)}</div>
        <div class="receipt-date">${dateStr}</div>
        <span class="receipt-category">${esc(r.category)}</span>
      </div>
      <div class="receipt-amount" onclick="openDetail(${r.id})">€ ${fmt(r.amount)}</div>
      <div class="receipt-actions">
        <button class="receipt-action-btn" onclick="quickDelete(${r.id})">🗑️</button>
      </div>`;
    lista.appendChild(card);
  }
}

// ===== ADD MODAL =====
let selectedPhotoBlob = null;

function openAddModal() {
  selectedPhotoBlob = null;
  resetPhotoArea();
  document.getElementById('inputDesc').value = '';
  document.getElementById('inputAmount').value = '';
  document.getElementById('inputCategory').value = 'Altro';
  document.getElementById('inputDate').value = today();
  document.getElementById('modalAdd').classList.add('open');
  setTimeout(() => document.getElementById('inputDesc').focus(), 300);
}

function resetPhotoArea() {
  const area = document.getElementById('photoArea');
  area.classList.remove('has-photo');
  area.innerHTML = `
    <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="onPhotoSelected(event)">
    <div class="photo-icon">📷</div>
    <div class="photo-area-label">Tocca per scattare una foto</div>
    <div class="photo-change-overlay">Tocca per cambiare foto</div>`;
}

function onPhotoSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  // Comprimi subito prima di mostrare l'anteprima
  compressPhotoForStorage(file).then(compressed => {
    selectedPhotoBlob = compressed;
    const url = URL.createObjectURL(compressed);
    const area = document.getElementById('photoArea');
    area.classList.add('has-photo');
    area.innerHTML = `
      <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="onPhotoSelected(event)">
      <img src="${url}" alt="preview">
      <div class="photo-change-overlay">Tocca per cambiare foto</div>`;
  });
}

// Comprimi foto prima del salvataggio (max 1400px, JPEG 0.78)
function compressPhotoForStorage(blob) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const MAX = 1400;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX || h > MAX) {
        const r = Math.min(MAX / w, MAX / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => resolve(b || blob), 'image/jpeg', 0.78);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(blob); };
    img.src = url;
  });
}

async function saveReceipt() {
  const desc = document.getElementById('inputDesc').value.trim();
  const amountRaw = document.getElementById('inputAmount').value.trim().replace(',','.');
  const amount = parseFloat(amountRaw);
  if (!desc) { showToast('Inserisci una descrizione'); return; }
  if (isNaN(amount) || amount < 0) { showToast('Inserisci un importo valido'); return; }

  await dbPut({
    id: Date.now(),
    description: desc,
    amount,
    category: document.getElementById('inputCategory').value,
    date: document.getElementById('inputDate').value,
    photoBlob: selectedPhotoBlob || null
  });
  document.getElementById('modalAdd').classList.remove('open');
  await renderAll();
  showToast('Scontrino salvato ✓');
}

// ===== DETAIL =====
async function openDetail(id) {
  currentDetailId = id;
  const r = (await dbGetAll()).find(x => x.id === id);
  if (!r) return;
  const photoEl = document.getElementById('detailPhoto');
  if (r.photoBlob) { photoEl.src = URL.createObjectURL(r.photoBlob); photoEl.style.display = 'block'; }
  else { photoEl.style.display = 'none'; }
  document.getElementById('detailAmount').textContent = '€ ' + fmt(r.amount);
  const dateStr = r.date ? new Date(r.date+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'}) : '—';
  document.getElementById('detailRows').innerHTML = `
    <div class="detail-row"><span>Descrizione</span><span>${esc(r.description)}</span></div>
    <div class="detail-row"><span>Categoria</span><span>${esc(r.category)}</span></div>
    <div class="detail-row"><span>Data</span><span>${dateStr}</span></div>`;
  document.getElementById('modalDetail').classList.add('open');
}

async function deleteCurrentReceipt() {
  if (!currentDetailId || !confirm('Eliminare questo scontrino?')) return;
  await dbDelete(currentDetailId);
  document.getElementById('modalDetail').classList.remove('open');
  await renderAll();
  showToast('Scontrino eliminato');
}

async function quickDelete(id) {
  if (!confirm('Eliminare questo scontrino?')) return;
  await dbDelete(id);
  await renderAll();
}

async function confirmDeleteAll() {
  const receipts = await dbGetAll();
  if (receipts.length === 0) { showToast('Nessuno scontrino da eliminare'); return; }
  if (!confirm(`Eliminare tutti i ${receipts.length} scontrini?`)) return;
  await dbClear();
  await renderAll();
}

// ===== EXPORT PDF =====
function blobToDataUrl(blob) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = () => rej(reader.error);
    reader.readAsDataURL(blob);
  });
}

// Ritorna { dataUrl, w, h } ridimensionato per il PDF (max pixW x pixH)
function resizeForPdf(blob, pixW, pixH) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const ratio = Math.min(pixW / w, pixH / h, 1);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.82), w, h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

async function exportPDF() {
  const receipts = await dbGetAll();
  if (receipts.length === 0) { showToast('Nessuno scontrino da esportare'); return; }
  showToast('Generazione PDF…');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const PW = 210, PH = 297;
  const ML = 12, MR = 12;
  const CW = PW - ML - MR;
  let y = 0;

  const fmtDate = (d) => d
    ? new Date(d + 'T00:00:00').toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' })
    : '—';

  const addHeader = () => {
    doc.setFillColor(26, 115, 232);
    doc.rect(0, 0, PW, 20, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(15); doc.setFont('helvetica', 'bold');
    doc.text('🧾 Scontrini', ML, 13);
    doc.setFontSize(8); doc.setFont('helvetica', 'normal');
    const now = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    doc.text('Generato il ' + now, PW - MR, 13, { align: 'right' });
    y = 26;
  };

  // Pagina 1 — riepilogo
  addHeader();
  const total = receipts.reduce((s, r) => s + r.amount, 0);
  receipts.sort((a, b) => b.id - a.id);

  doc.setFillColor(232, 240, 254);
  doc.roundedRect(ML, y, CW, 14, 2, 2, 'F');
  doc.setTextColor(26, 115, 232); doc.setFontSize(10); doc.setFont('helvetica', 'normal');
  doc.text(receipts.length + (receipts.length === 1 ? ' scontrino' : ' scontrini'), ML + 4, y + 9);
  doc.setTextColor(52, 168, 83); doc.setFontSize(13); doc.setFont('helvetica', 'bold');
  doc.text('€ ' + total.toFixed(2).replace('.', ','), PW - MR - 4, y + 9, { align: 'right' });
  y += 20;

  // Tabella riepilogo
  const colW = [70, 30, 28, 28, 26];
  const headers = ['Descrizione', 'Categoria', 'Data', 'Importo', 'Foto'];
  doc.setFillColor(220, 228, 244);
  doc.rect(ML, y, CW, 8, 'F');
  doc.setTextColor(26, 40, 80); doc.setFontSize(8); doc.setFont('helvetica', 'bold');
  let cx = ML + 2;
  headers.forEach((h, i) => { doc.text(h, cx, y + 5.5); cx += colW[i]; });
  y += 8;

  for (const r of receipts) {
    if (y > PH - 16) {
      doc.addPage(); addHeader();
    }
    const rowBg = receipts.indexOf(r) % 2 === 0 ? [255,255,255] : [248,249,250];
    doc.setFillColor(...rowBg);
    doc.rect(ML, y, CW, 9, 'F');
    doc.setTextColor(32, 33, 36); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    cx = ML + 2;
    doc.text(r.description || '', cx, y + 6, { maxWidth: colW[0] - 3 }); cx += colW[0];
    doc.setTextColor(95, 99, 104);
    doc.text(r.category || '', cx, y + 6, { maxWidth: colW[1] - 2 }); cx += colW[1];
    doc.text(fmtDate(r.date), cx, y + 6); cx += colW[2];
    doc.setTextColor(52, 168, 83); doc.setFont('helvetica', 'bold');
    doc.text('€ ' + r.amount.toFixed(2).replace('.', ','), cx, y + 6); cx += colW[3];
    doc.setTextColor(r.photoBlob ? 26 : 150, r.photoBlob ? 115 : 150, r.photoBlob ? 232 : 150);
    doc.text(r.photoBlob ? '✓ p.' + (receipts.indexOf(r) + 2) : '—', cx, y + 6);
    doc.setDrawColor(218, 220, 224);
    doc.line(ML, y + 9, ML + CW, y + 9);
    y += 9;
  }

  // Riga totale
  if (y > PH - 20) { doc.addPage(); addHeader(); }
  doc.setFillColor(26, 115, 232);
  doc.rect(ML, y + 2, CW, 9, 'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('TOTALE', ML + 2, y + 7.5);
  doc.text('€ ' + total.toFixed(2).replace('.', ','), ML + colW[0] + colW[1] + colW[2] + 2, y + 7.5);

  // Pagine dettaglio — una per ogni scontrino con foto
  for (const r of receipts) {
    if (!r.photoBlob) continue;
    doc.addPage();
    addHeader();

    // Titolo carta
    doc.setFillColor(248, 249, 250);
    doc.roundedRect(ML, y, CW, 12, 2, 2, 'F');
    doc.setTextColor(32, 33, 36); doc.setFontSize(12); doc.setFont('helvetica', 'bold');
    doc.text(r.description || '', ML + 4, y + 8, { maxWidth: CW - 60 });
    doc.setTextColor(52, 168, 83); doc.setFontSize(13);
    doc.text('€ ' + r.amount.toFixed(2).replace('.', ','), PW - MR - 3, y + 8, { align: 'right' });
    y += 15;

    doc.setTextColor(95, 99, 104); doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text(r.category + '   •   ' + fmtDate(r.date), ML, y);
    y += 7;

    // Foto grande — max larghezza intera, altezza max 210mm
    const maxPhotoH = PH - y - 16;
    const imgData = await resizeForPdf(r.photoBlob, 1400, Math.round(maxPhotoH / 210 * 1400 * 2));
    if (imgData) {
      const aspect = imgData.w / imgData.h;
      let dw = CW, dh = dw / aspect;
      if (dh > maxPhotoH) { dh = maxPhotoH; dw = dh * aspect; }
      const imgX = ML + (CW - dw) / 2;
      doc.setDrawColor(200, 200, 200);
      doc.roundedRect(imgX - 1, y - 1, dw + 2, dh + 2, 2, 2);
      doc.addImage(imgData.dataUrl, 'JPEG', imgX, y, dw, dh);
    }
  }

  doc.save('scontrini_' + today() + '.pdf');
  showToast('PDF scaricato ✓');
}

// ===== BACKUP / RIPRISTINA =====
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = () => rej(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function exportBackup() {
  const receipts = await dbGetAll();
  if (receipts.length === 0) { showToast('Nessuno scontrino da salvare'); return; }
  showToast('Preparazione backup…');
  const data = [];
  for (const r of receipts) {
    const entry = { ...r, photoBlob: null, photoData: null };
    if (r.photoBlob) entry.photoData = await blobToBase64(r.photoBlob);
    data.push(entry);
  }
  const json = JSON.stringify({ version: 1, date: today(), receipts: data });
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scontrini_backup_' + today() + '.json';
  a.click();
  showToast('Backup scaricato ✓');
}

async function importBackup(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const text = await file.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { showToast('File non valido'); return; }
  if (!parsed.receipts || !Array.isArray(parsed.receipts)) { showToast('File non valido'); return; }

  const existing = await dbGetAll();
  const existingIds = new Set(existing.map(r => r.id));
  let imported = 0, skipped = 0;

  for (const r of parsed.receipts) {
    if (existingIds.has(r.id)) { skipped++; continue; }
    let blob = null;
    if (r.photoData) {
      const res = await fetch(r.photoData);
      const raw = await res.blob();
      blob = await compressPhotoForStorage(raw); // comprimi anche le foto vecchie
    }
    await dbPut({ ...r, photoBlob: blob, photoData: undefined });
    imported++;
  }

  await renderAll();
  showToast(`Importati ${imported} scontrini` + (skipped ? `, ${skipped} già presenti` : '') + ' ✓');
}

// ===== EXPORT CSV =====
async function exportCSV() {
  const receipts = await dbGetAll();
  if (receipts.length === 0) { showToast('Nessuno scontrino da esportare'); return; }
  receipts.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const rows = receipts.map(r => [r.date||'', `"${(r.description||'').replace(/"/g,'""')}"`, `"${r.category||''}"`, fmt(r.amount)]);
  const total = receipts.reduce((s,r) => s+r.amount, 0);
  rows.push(['','"TOTALE"','', fmt(total)]);
  const csv = ['Data;Descrizione;Categoria;Importo (€)', ...rows.map(r=>r.join(';'))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scontrini_'+today()+'.csv';
  a.click();
  showToast('CSV esportato ✓');
}

function shareApp() {

  if (navigator.share) {
    navigator.share({ title: 'Scontrini', text: 'Gestione scontrini — funziona offline!', url });

// ===== TEMA =====
function toggleTheme() {
  const html = document.documentElement;
  const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  document.getElementById('themeBtn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', newTheme);
}

function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
}

// ===== UTILS =====
function closeOnOverlay(e, id) {
  if (e.target === document.getElementById(id)) document.getElementById(id).classList.remove('open');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(n) { return n.toFixed(2).replace('.',','); }
function today() { return new Date().toISOString().split('T')[0]; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
initTheme();
openDB().then(() => renderAll());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
